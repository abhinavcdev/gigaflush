# Release pipeline. Push a tag like v0.2.0 and this:
#
#   1. Builds macOS (universal), Windows x64, and Linux x86_64.
#   2. Signs + notarizes macOS and signs Windows when the secrets below exist
#      (unsigned/ad-hoc otherwise, so the pipeline still runs before you
#      have certificates).
#   3. Publishes a public GitHub Release with the free Linux builds and
#      stable-named copies for the landing page:
#        https://github.com/<owner>/<repo>/releases/latest/download/Gigaflush-linux-x86_64.AppImage
#   4. Keeps the paid macOS/Windows installers as private workflow artifacts
#      ("paid-installers"), which you upload to the Polar products.
#
# macOS secrets:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#                  APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific),
#                  APPLE_TEAM_ID
# Windows secrets: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID,
#                  AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#                  AZURE_SIGNING_PROFILE   (Azure Artifact Signing)
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: windows-latest
            name: windows
            rust-targets: ""
            args: ""
          - platform: ubuntu-22.04
            name: linux
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      # Only export signing variables that are actually set: Tauri treats an
      # empty APPLE_CERTIFICATE as "sign with this" and fails.
      - name: Configure macOS signing
        if: matrix.name == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then echo "$v=${!v}" >> "$GITHUB_ENV"; fi
          done
          [ -n "$APPLE_CERTIFICATE" ] || echo "::warning::No Apple certificate: macOS build is ad-hoc signed, not notarized. Do not sell it."

      - name: Configure Windows signing
        if: matrix.name == 'windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::warning::No Azure signing secrets: Windows installer is unsigned. Do not sell it."
            exit 0
          fi
          cargo install artifact-signing-cli --locked
          {
            echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
            echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
            echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
          } >> "$GITHUB_ENV"
          printf '{"bundle":{"windows":{"signCommand":"artifact-signing-cli -e %s -a %s -c %s -d Gigaflush %%1"}}}' \
            "$ENDPOINT" "$ACCOUNT" "$PROFILE" > src-tauri/tauri.signing.conf.json
          echo "SIGNING_ARGS=--config src-tauri/tauri.signing.conf.json" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build
        id: tauri
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }} ${{ env.SIGNING_ARGS }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), '\n') }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Name artifacts
        run: |
          set -euo pipefail
          mkdir -p public paid
          # Glob-based so small Tauri naming changes don't break the
          # pipeline; each entry maps whatever was built to a fixed name.
          stable() { # stable <dir> <glob> <name>
            local match
            match=$(find "assets/bundle-$1" -name "$2" | head -1)
            if [ -n "$match" ]; then
              cp "$match" "$4/$3"
              echo "$3  <-  $match"
            else
              echo "::warning::no artifact matched $2 (wanted $3)"
            fi
          }
          stable linux   "*.AppImage" Gigaflush-linux-x86_64.AppImage public
          stable linux   "*.deb"      Gigaflush-linux-amd64.deb       public
          stable macos   "*.dmg"      Gigaflush-macos-universal.dmg   paid
          stable windows "*setup.exe" Gigaflush-windows-x64-setup.exe paid
          (cd public && sha256sum Gigaflush-* > SHA256SUMS.txt)
          (cd paid && sha256sum Gigaflush-* > SHA256SUMS.txt)

      - name: Create GitHub Release (Linux only)
        run: |
          gh release create "${GITHUB_REF_NAME}" public/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Gigaflush ${GITHUB_REF_NAME}" \
            --notes "Linux builds are attached below and free. Signed macOS and Windows builds are available at https://gigaflush.app/#pricing — existing buyers can download this version from their Polar library. Or build from source; see the README." \
            || gh release upload "${GITHUB_REF_NAME}" public/* --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Keep paid installers private
        uses: actions/upload-artifact@v4
        with:
          name: paid-installers-${{ github.ref_name }}
          path: paid/*
          retention-days: 90
