# Release pipeline: build NodeMinus for every platform and publish a GitHub
# Release. A second job then attaches stable, version-free copies of each
# artifact (plus a checksum file) to that same release, so the landing page
# can link to permanent URLs like:
#
#   https://github.com/<owner>/<repo>/releases/latest/download/NodeMinus-macos-arm64.dmg
#
# GitHub resolves "latest/download/<name>" against whichever release is
# currently marked latest, so these links never need to change between
# versions. No external storage, domain, or secrets required beyond the
# token GitHub Actions already provides.
#
# Trigger: push a tag like v0.1.0
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - run: npm ci

      - name: Build and attach to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NodeMinus ${{ github.ref_name }}"
          releaseBody: "See the assets below for installers, or use the download page for a build picked for your platform automatically."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  attach-stable-downloads:
    name: Attach stable-named downloads
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download this release's assets
        run: |
          mkdir -p assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir assets
          ls -la assets

      - name: Build stable-named copies + checksums
        run: |
          set -euo pipefail
          mkdir -p out

          # Glob-based so minor Tauri artifact-naming changes don't break
          # the pipeline — each entry maps "whatever tauri-action produced"
          # to the fixed name the landing page links to.
          stable() { # stable <glob> <stable-name>
            local match
            match=$(find assets -maxdepth 1 -name "$1" | head -1)
            if [ -n "$match" ]; then
              cp "$match" "out/$2"
              echo "$2  <-  $(basename "$match")"
            else
              echo "::warning::no artifact matched $1 (wanted $2)"
            fi
          }
          stable "*aarch64*.dmg"  "NodeMinus-macos-arm64.dmg"
          stable "*x64*.dmg"      "NodeMinus-macos-x64.dmg"
          stable "*setup.exe"     "NodeMinus-windows-x64-setup.exe"
          stable "*.AppImage"     "NodeMinus-linux-x86_64.AppImage"
          stable "*amd64*.deb"    "NodeMinus-linux-amd64.deb"

          (cd out && shasum -a 256 NodeMinus-* > SHA256SUMS.txt)

      - name: Attach stable copies to the release
        run: |
          gh release upload "${GITHUB_REF_NAME}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          echo "Attached $(ls out | wc -l) files to ${GITHUB_REF_NAME}"
