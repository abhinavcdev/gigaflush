# Release pipeline. Two ways to start it:
#
#   • Actions → Release → Run workflow, and type a version (e.g. 0.2.0). The
#     workflow bumps the version in package.json, tauri.conf.json and
#     Cargo.toml, commits, tags v0.2.0, and releases from that tag.
#   • Or bump the versions yourself and push a tag: git tag v0.2.0 && git push --tags
#
# It builds macOS (universal), Windows x64 and Linux x86_64, then publishes a
# GitHub Release with every installer under a stable name, so the website's
# buttons always download the newest build:
#   https://github.com/<owner>/<repo>/releases/latest/download/Gigaflush-macos-universal.dmg
#
# Builds are not code-signed (macOS is ad-hoc signed via tauri.conf.json).
# The site's download section explains the one-time first-launch prompt.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.2.0)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump version, commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version like 0.2.0"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const conf = "src-tauri/tauri.conf.json";
            const json = JSON.parse(fs.readFileSync(conf, "utf8"));
            json.version = v;
            fs.writeFileSync(conf, JSON.stringify(json, null, 2) + "\n");
            const bump = (file, re) => fs.writeFileSync(file, fs.readFileSync(file, "utf8").replace(re, `$1"${v}"`));
            bump("src-tauri/Cargo.toml", /^(version = )"[^"]*"/m);
            bump("src-tauri/Cargo.lock", /(name = "gigaflush"\nversion = )"[^"]*"/);
          ' "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"

      - name: Resolve tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: windows-latest
            name: windows
            rust-targets: ""
            args: ""
          - platform: ubuntu-22.04
            name: linux
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            rpm

      - run: npm ci

      - name: Build
        id: tauri
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), '\n') }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Name artifacts
        run: |
          set -euo pipefail
          mkdir -p public
          # Glob-based so small Tauri naming changes don't break the
          # pipeline; each entry maps whatever was built to a fixed name.
          stable() { # stable <platform> <glob> <name>
            local match
            match=$(find "assets/bundle-$1" -name "$2" | head -1)
            if [ -n "$match" ]; then
              cp "$match" "public/$3"
              echo "$3  <-  $match"
            else
              echo "::error::no artifact matched $2 (wanted $3)"
              return 1
            fi
          }
          stable macos   "*.dmg"      Gigaflush-macos-universal.dmg
          stable windows "*setup.exe" Gigaflush-windows-x64-setup.exe
          stable windows "*.msi"      Gigaflush-windows-x64.msi
          stable linux   "*.AppImage" Gigaflush-linux-x86_64.AppImage
          stable linux   "*.deb"      Gigaflush-linux-amd64.deb
          stable linux   "*.rpm"      Gigaflush-linux-x86_64.rpm
          (cd public && sha256sum Gigaflush-* > SHA256SUMS.txt)
          cat public/SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          Free for every platform. Download the file for your system below, or use the buttons on [gigaflush.com](https://gigaflush.com/#download).

          | Platform | File |
          |---|---|
          | macOS 11+ (Apple Silicon and Intel) | `Gigaflush-macos-universal.dmg` |
          | Windows 10/11 x64 | `Gigaflush-windows-x64-setup.exe` or `.msi` |
          | Linux x86_64 | `.AppImage`, `.deb` or `.rpm` |

          **First launch.** These builds aren't code-signed, so the OS asks once:
          - **macOS:** open the app, then System Settings → Privacy & Security → **Open Anyway**. Or run `xattr -dr com.apple.quarantine /Applications/Gigaflush.app`.
          - **Windows:** on the SmartScreen prompt, click **More info → Run anyway**.
          - **Linux:** `chmod +x Gigaflush-linux-x86_64.AppImage`, then run it.

          Verify downloads with `SHA256SUMS.txt`. If Gigaflush saved you some space, there's a [tip jar](https://gigaflush.com/#tip).
          EOF

      - name: Create GitHub Release
        run: |
          gh release create "$TAG" public/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gigaflush ${TAG#v}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            || gh release upload "$TAG" public/* --repo "$GITHUB_REPOSITORY" --clobber
